[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "course-insight"
version = "0.1.0"
description = "课业智析无 HTTP 模块化单体框架"
requires-python = ">=3.11"
dependencies = [
    "Django>=5.2,<5.3",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.10,<3",
    "psycopg[binary,pool]>=3.2,<4",
    "pypdf>=6,<7",
    "python-docx>=1.2,<2",
    "python-pptx>=1,<2",
    "numpy>=2.0,<3",
    "scipy>=1.13,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=7,<8",
    "pytest-django>=4.12,<5",
]
intent = [
    "scikit-learn>=1.5,<2",
    "joblib>=1.4,<2",
]
performance = [
    "numpy>=2,<3",
]
ocr = [
    "PyMuPDF>=1.24,<2",
]
privacy = [
    "presidio-analyzer>=2.2,<3",
    "spacy>=3.8,<4",
    "scikit-learn>=1.5,<2",
    "joblib>=1.4,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "course_insight.web_project.settings"
testpaths = ["tests"]
norecursedirs = ["runtime", ".tmp_*", "tmp_*", ".git", "build", "dist"]
