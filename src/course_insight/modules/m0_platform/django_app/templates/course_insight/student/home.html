{% extends "course_insight/base.html" %}
{% block title %}学生端 · 课业智析{% endblock %}
{% block content %}
  <h1>学生端</h1>
  <p>选择已加入的课程与班级后，会先看到掌握画像、进步轨迹和下一步练习，再开始测评。</p>
  <div class="card">
    <h2>我的课程和班级</h2>
    {% if available_workspaces %}
      <form method="get" action="{% url 'student-select-workspace' %}">
        {{ workspace_form.as_p }}
        <button type="submit">进入课程</button>
      </form>
    {% else %}
      <p class="muted">教师尚未邀请你加入任何班级。</p>
    {% endif %}
  </div>
{% endblock %}
